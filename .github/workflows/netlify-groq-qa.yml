name: Guru AI Netlify GroqCloud QA
on:
  push:
    branches: [main, feat/groq-video-WBX9Yvk4eKs-20261109]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check sites/guru-ai-v2/public/app.js
          node --check sites/guru-ai-v2/public/groq-client.js
          node --check sites/guru-ai-utama/public/groq-client.js
          node --check sites/guru-ai-v2/netlify/functions/groq-api.mjs
          node --check sites/guru-ai-utama/netlify/functions/groq-api.mjs
      - name: Run BYOK, model fallback and data safety tests
        run: node --test tests/groq-netlify.test.mjs
      - name: Assemble both Netlify source packages
        run: |
          cd sites/guru-ai-utama && zip -q -r "$GITHUB_WORKSPACE/guru-ai-utama-groq.zip" public netlify netlify.toml
          cd "$GITHUB_WORKSPACE/sites/guru-ai-v2" && zip -q -r "$GITHUB_WORKSPACE/guru-ai-v2-groq.zip" public netlify netlify.toml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guru-ai-groqcloud-netlify-packages
          path: |
            guru-ai-utama-groq.zip
            guru-ai-v2-groq.zip
          if-no-files-found: error

  deploy:
    name: Publish both original Netlify sites after QA
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Report missing publishing permission
        if: env.NETLIFY_AUTH_TOKEN == ''
        run: echo "::warning::Netlify production deploy skipped. Configure NETLIFY_AUTH_TOKEN in repository Actions secrets, or connect each original Netlify site to its repository base directory."
      - name: Install Netlify CLI
        if: env.NETLIFY_AUTH_TOKEN != ''
        run: npm install --global netlify-cli@latest
      - name: Publish Guru AI original site
        if: env.NETLIFY_AUTH_TOKEN != ''
        working-directory: sites/guru-ai-utama
        run: netlify deploy --prod --dir public --functions netlify/functions --site b2445b3b-5d9b-479e-a4bd-46968d34f9c3 --message "GroqCloud tutorial WBX9Yvk4eKs"
      - name: Publish Guru AI V2 site
        if: env.NETLIFY_AUTH_TOKEN != ''
        working-directory: sites/guru-ai-v2
        run: netlify deploy --prod --dir public --functions netlify/functions --site 52ed7004-6ccf-4f8a-afdd-22062958dd9a --message "GroqCloud tutorial WBX9Yvk4eKs"
